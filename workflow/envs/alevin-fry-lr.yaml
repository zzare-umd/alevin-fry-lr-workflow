# Everything the workflow runs: demultiplexing (BLAZE), alignment (minimap2), BAM handling (samtools,
# pysam), the workflow engine, and the Rust toolchain, cmake and C compiler that build alevin-fry.
name: alevin-fry-lr
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - snakemake-minimal>=8.0
  - minimap2>=2.28
  - samtools>=1.20
  - pysam>=0.22
  - rust>=1.85
  - cmake
  - c-compiler
  - pip
  - pip:
      - blaze2==2.5.1
