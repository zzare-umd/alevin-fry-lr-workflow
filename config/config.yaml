# alevin-fry-lr workflow configuration. Fill in the paths below, then run from the repository directory:
#   snakemake --cores 32
# (to keep several configurations, copy this file and pass the copy with --configfile)

# One entry per library. platform is ONT or PacBio (it picks the minimap2 preset: map-ont or map-hifi).
# expect_cells is BLAZE's expected number of cells (used to find the barcode whitelist of this library).
# A library of another chemistry can carry its own `whitelist:` here, overriding the common one below.
samples:
  pbmc_ont:
    fastq: /path/to/pbmc_ont.fastq.gz
    platform: ONT
    expect_cells: 5000

# 10x barcode whitelist for the chemistry (3' v3: 3M-february-2018.txt, shipped with Cell Ranger under
# lib/python/cellranger/barcodes/, gunzipped). If BLAZE reports almost no cells, try the reverse-
# complemented whitelist: some basecalling / library setups put the barcodes on the other strand.
whitelist: /path/to/3M-february-2018.txt

# Reference transcriptome (FASTA of transcript sequences; GENCODE transcripts.fa works). Transcript names
# are taken as the first word of each header.
transcriptome: /path/to/gencode.vXX.transcripts.fa

# The alevin-fry binary. If this file does not exist, the workflow builds it there from the long-read
# branch (cargo, cmake and a C compiler come with the conda environment; a few minutes). Point it at a
# binary you already have to skip that.
alevin_fry: bin/alevin-fry
# alevin_fry_git: https://github.com/COMBINE-lab/alevin-fry     # where to build it from, and which branch
# alevin_fry_branch: long-read
results_dir: results

threads: 32

# Alignments within this fraction of a read's best alignment score are kept as that read's candidates
score_threshold: 1.0

# Orientation of the reads relative to the transcripts. BLAZE writes its matched reads in the
# transcript orientation, so this is fw.
expected_ori: fw

# Quantification model (see README, "Parameters that matter"). These are the settings we run.
quant:
  cell_prior: 0.25          # --truncation-cell-prior: within-cell Dirichlet pseudo-count toward equal isoform shares
  positional_power: 0.5     # --truncation-positional-power: how strongly read positions weigh in against abundances;
                            # a list such as [0.25, 0.5] runs every value
